server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: mọi route không match file tĩnh → trả về index.html
    # Cần thiết cho react-router: nếu user vào thẳng /articles/my-slug
    # nginx phải trả index.html để React Router xử lý, không được trả 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
